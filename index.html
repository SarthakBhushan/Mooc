<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MCQ Practice</title>
<style>
  :root{
    --bg:#f3f5f7; --card:#ffffff; --ink:#18212b; --muted:#5d6b7a; --line:#d8dee5;
    --accent:#1f5eff; --accent-ink:#ffffff; --good:#12805c; --bad:#c2352b; --warn:#a96a00;
  }
  @media (prefers-color-scheme: dark){
    :root{ --bg:#10151b; --card:#19212a; --ink:#e8edf2; --muted:#9aa8b6; --line:#2c3844;
      --accent:#5b8cff; --accent-ink:#0b1220; --good:#3fc796; --bad:#ff7a6e; --warn:#e0a53a; }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:16px; line-height:1.5;
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .wrap{max-width:720px;margin:0 auto;padding:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
  h1{font-size:22px;margin:0 0 4px}
  h2{font-size:18px;margin:0 0 12px}
  p.sub{color:var(--muted);margin:0 0 18px}
  label{display:block;font-weight:600;margin:16px 0 6px}
  input[type=number]{
    width:100%;padding:12px;font-size:18px;border:1px solid var(--line);border-radius:8px;
    background:var(--bg);color:var(--ink);
  }
  .row{display:flex;gap:12px}
  .row>div{flex:1}
  .hint{color:var(--muted);font-size:14px;margin-top:6px}
  .check{display:flex;align-items:center;gap:10px;font-weight:500;margin:14px 0 0}
  .check input{width:20px;height:20px}
  button{
    font:inherit;font-weight:600;border:0;border-radius:10px;padding:14px 18px;cursor:pointer;
    background:var(--accent);color:var(--accent-ink);
  }
  button.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
  button.danger{background:var(--bad);color:#fff}
  button:disabled{opacity:.4;cursor:default}
  .full{width:100%;margin-top:22px}
  .hidden{display:none !important}

  /* exam bar */
  .bar{
    position:sticky;top:0;z-index:5;background:var(--bg);
    padding:calc(env(safe-area-inset-top) + 8px) 0 8px;
    display:flex;align-items:center;justify-content:space-between;gap:8px;
  }
  .timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
  .timer.low{color:var(--bad)}
  .count{color:var(--muted);font-size:14px}
  .progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}
  .progress i{display:block;height:100%;background:var(--accent);width:0}

  .qtext{font-size:18px;font-weight:600;margin:0 0 16px;white-space:pre-wrap}
  .opt{
    display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
    background:var(--bg);color:var(--ink);border:2px solid var(--line);
    border-radius:10px;padding:12px 14px;margin-bottom:10px;font-weight:500;
  }
  .opt .k{
    flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);
    display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;
  }
  .opt .t{flex:1;white-space:pre-wrap;overflow-wrap:anywhere}
  .opt.sel{border-color:var(--accent)}
  .opt.sel .k{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

  .nav{display:flex;gap:10px;margin-top:14px}
  .nav button{flex:1}
  .nav .mid{flex:none}

  /* palette */
  .palette{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:8px;margin:12px 0}
  .pal{padding:10px 0;background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:8px;font-weight:600}
  .pal.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  .pal.cur{outline:3px solid var(--warn);outline-offset:1px}

  /* result */
  .big{font-size:44px;font-weight:800;margin:4px 0}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:18px 0}
  .stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center}
  .stat b{display:block;font-size:26px}
  .stat span{color:var(--muted);font-size:13px}
  .good{color:var(--good)} .bad{color:var(--bad)} .warn{color:var(--warn)}

  .modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}
  .modal .card{max-width:420px;width:100%}
  .modal .btns{display:flex;gap:10px;margin-top:16px}
  .modal .btns button{flex:1}

  /* home / mode cards */
  .mode{
    display:block;width:100%;text-align:left;margin-top:12px;padding:16px;
    background:var(--bg);color:var(--ink);border:2px solid var(--line);border-radius:12px;
  }
  .mode b{display:block;font-size:18px;margin-bottom:2px}
  .mode span{color:var(--muted);font-weight:500;font-size:15px}
  .mode:active{border-color:var(--accent)}

  /* practice feedback */
  .opt:disabled{cursor:default;opacity:1}
  .opt.right{border-color:var(--good);background:color-mix(in srgb, var(--good) 16%, var(--bg))}
  .opt.right .k{background:var(--good);border-color:var(--good);color:#fff}
  .opt.wrong{border-color:var(--bad);background:color-mix(in srgb, var(--bad) 16%, var(--bg))}
  .opt.wrong .k{background:var(--bad);border-color:var(--bad);color:#fff}
  .verdict{margin-top:6px;padding:12px 14px;border-radius:10px;font-weight:600;border:1px solid var(--line);background:var(--bg)}
  .verdict.good{border-color:var(--good)}
  .verdict.bad{border-color:var(--bad)}
  .verdict small{display:block;font-weight:500;color:var(--ink);margin-top:2px;white-space:pre-wrap;overflow-wrap:anywhere}
  .pscore{font-weight:700;font-size:15px}
</style>
</head>
<body>
<div class="wrap">

  <!-- SETUP -->
  <!-- HOME -->
  <section id="home" class="card">
    <h1>MCQ Practice</h1>
    <p class="sub">Choose how you want to study.</p>
    <button class="mode" id="modePractice"><b>Practice</b><span>One question at a time. Submit each answer and see right away if it was correct.</span></button>
    <button class="mode" id="modeTest"><b>Test</b><span>Timed exam. Answer freely and see your score at the end.</span></button>
  </section>

  <!-- SETUP -->
  <section id="setup" class="card hidden">
    <h1 id="setupTitle">Test</h1>
    <p class="sub" id="setupSub"></p>

    <label for="numQ">Number of questions</label>
    <input type="number" id="numQ" min="1" inputmode="numeric">
    <div class="hint" id="numHint"></div>

    <div id="timeWrap">
      <label for="mins">Time (minutes)</label>
      <input type="number" id="mins" min="1" inputmode="numeric">
      <div class="hint">Set at 1.5 minutes per question. You can change it.</div>
    </div>
    <p class="hint">Questions and options are shown exactly as written. Only their order is shuffled.</p>

    <button class="full" id="startBtn">Start test</button>
    <button class="full ghost" id="backBtn" style="margin-top:10px">Back</button>
  </section>

  <!-- EXAM -->
  <!-- PRACTICE -->
  <section id="practice" class="hidden">
    <div class="bar">
      <div class="count" id="pCount"></div>
      <div class="pscore"><span class="good" id="pC">0</span> correct · <span class="bad" id="pW">0</span> wrong</div>
      <button class="ghost" id="pEnd" style="padding:8px 12px">End</button>
    </div>
    <div class="progress"><i id="pProg"></i></div>
    <div class="card">
      <p class="qtext" id="pQ"></p>
      <div id="pOpts"></div>
      <div id="pVerdict" class="verdict hidden"></div>
    </div>
    <button class="full" id="pAction">Submit answer</button>
  </section>

  <!-- EXAM -->
  <section id="exam" class="hidden">
    <div class="bar">
      <div class="timer" id="timer">00:00:00</div>
      <div class="count" id="count"></div>
      <button class="ghost" id="palBtn" style="padding:8px 12px">Questions</button>
    </div>
    <div class="progress"><i id="prog"></i></div>

    <div class="card">
      <p class="qtext" id="qtext"></p>
      <div id="opts"></div>
      <div class="nav">
        <button class="ghost" id="prevBtn">Previous</button>
        <button class="ghost mid" id="clearBtn">Clear</button>
        <button id="nextBtn">Next</button>
      </div>
    </div>
    <button class="full danger" id="submitBtn">Submit test</button>
  </section>

  <!-- PALETTE -->
  <div id="palModal" class="modal hidden">
    <div class="card" style="max-height:85vh;overflow:auto">
      <h2>Jump to question</h2>
      <div class="palette" id="palette"></div>
      <button class="full ghost" id="palClose" style="margin-top:6px">Close</button>
    </div>
  </div>

  <!-- CONFIRM SUBMIT -->
  <div id="confirmModal" class="modal hidden">
    <div class="card">
      <h2>Submit test?</h2>
      <p id="confirmMsg" style="margin:0"></p>
      <div class="btns">
        <button class="ghost" id="confirmNo">Go back</button>
        <button class="danger" id="confirmYes">Submit</button>
      </div>
    </div>
  </div>

  <!-- RESULT -->
  <section id="result" class="card hidden">
    <h1>Result</h1>
    <div class="big" id="scoreBig"></div>
    <div class="hint" id="timeUsed"></div>
    <div class="stats">
      <div class="stat"><b class="good" id="rCorrect">0</b><span>Correct</span></div>
      <div class="stat"><b class="bad" id="rWrong">0</b><span>Incorrect</span></div>
      <div class="stat"><b class="warn" id="rSkip">0</b><span>Not attempted</span></div>
    </div>
    <button class="full" id="againBtn">Back to home</button>
  </section>

</div>

<script>
/* ============================================================
   QUESTIONS
   Format: { q: "question text", o: ["option 1","option 2",...], a: index_of_correct_option (0 = first) }
   Add more questions to this list (keep the same format).
   ============================================================ */
const QUESTIONS = [
  /* Week 0 */
  { q: "What is Psychology?", o: ["Just a social media trend", "An art of living", "A subject about human body", "A study of cognitive processes & behavior"], a: 3 },
  { q: "A broad field of study that explores a variety of questions about thoughts, feelings and actions is -------?", o: ["Society", "Globalization", "Psychology", "Social Science"], a: 2 },
  { q: "Learning has been a central topic of research in ___.", o: ["Chemistry", "Physics", "Mathematics", "Psychology"], a: 3 },
  { q: "The word Psyche means -------------?", o: ["Body or physique", "Mind or soul", "Spirituality", "Hormones"], a: 1 },
  { q: "The ___ of learning focuses on how people learn.", o: ["psychology", "english", "chemistry", "none of the given"], a: 0 },
  { q: "To help people to function effectively and fulfill their own unique potential” is the aim of------------?", o: ["Humanistic psychology", "Evolutionary biology", "Computer science", "Microbiology"], a: 0 },
  { q: "Psychology is not an independent science, but dependent on other fields.", o: ["True", "False"], a: 1 },
  { q: "The study of changes in an individual’s behavior during his/her lifetime is called ----------.", o: ["Hormonal psychology", "Gender psychology", "Developmental Psychology", "Genetics or Heredity"], a: 2 },
  { q: "The study of differences and similarities in the behavior of animals of different species is called ------------------------.", o: ["Developmental psychology", "Cultural psychology", "Personality psychology", "Comparative Psychology"], a: 3 },
  { q: "Humans are incapable of learning.", o: ["True", "False"], a: 1 },

  /* Week 1 */
  { q: "Learning is often seen as the contiguous causal effect of ____ on behavior.", o: ["blood", "bone density", "trauma", "experience"], a: 3 },
  { q: "In order to say that learning has occurred, a hidden change in behavior must occur.", o: ["True", "False"], a: 1 },
  { q: "Which of the following is not a mental construct?", o: ["skeleton", "knowledge", "representations", "associations"], a: 0 },
  { q: "Learning changes the ___ structure of the brain through the process of continuous interactions between the learner and the external environment.", o: ["physical", "social", "biological", "none of the given"], a: 0 },
  { q: "___ shapes the learning process.", o: ["Only thoughts", "Only emotions", "Both thoughts and emotions", "Neither thoughts nor emotions"], a: 2 },
  { q: "Watson's work included the famous Little Albert experiment in which he conditioned a small child to ___ a white rat.", o: ["fear", "love", "hate", "play with"], a: 0 },
  { q: "Behaviorism dominated psychology for much of the early ___ century.", o: ["20th", "19th", "18th", "17th"], a: 0 },
  { q: "The state of “conscious incompetence” may be valuable ____ of a learning experience.", o: ["at the end", "in the middle", "2 years after the end", "at the start"], a: 3 },
  { q: "Which of the following is not an outcome of effective e-learning?", o: ["wider range of strategies", "more reflective approach", "more positive emotions towards learning", "more disconnected knowledge"], a: 3 },
  { q: "Instrumental conditioning is an example of ___ learning.", o: ["sensitization", "habituation", "associative", "meaningful"], a: 2 },

  /* Week 2 */
  { q: "The three major types of learning described by ___ psychology are classical conditioning, operant conditioning and observational learning.", o: ["cognitive", "behavioral", "emotional", "evolutionary"], a: 1 },
  { q: "According to the view of Watson, psychology is ___.", o: ["subjective", "only descriptive", "experimental", "about internal mental processes that cannot be measured and observed"], a: 2 },
  { q: "___ is given by Ivan Pavlov.", o: ["Operant conditioning", "Functional conditioning", "Classical conditioning", "Modern conditioning"], a: 2 },
  { q: "The process by which organisms learn to respond to certain stimuli but not to others is known as ___.", o: ["stimulus generalization", "stimulus appreciation", "stimulus discrimination", "stimulus differentiation"], a: 2 },
  { q: "Higher-order conditioning is intrinsically weaker than its first-order counterpart.", o: ["True", "False"], a: 0 },
  { q: "____ is the process of gradually changing the quality of a response.", o: ["Shaping", "Modeling", "Cueing", "Shifting"], a: 0 },
  { q: "The works of ___ were instrumental in engendering the dramatic shift from behaviorism to cognitive theories.", o: ["Edward C. Tolman", "Jean Piaget", "German Gestalt", "All of the given"], a: 3 },
  { q: "___ intelligence is the ability to perceive the visual–spatial world accurately and involves sensitivity to color, line, shape, form, space, and the potential for recognizing and manipulating the patterns of spaces.", o: ["Interpersonal", "Spatial", "Bodily-kinesthetic", "Linguistic"], a: 1 },
  { q: "Sternberg proposed his theory in 1985 as an alternative to the idea of the ___.", o: ["general intelligence factor", "multiple intelligences", "specific intelligence factor", "unconscious intelligence"], a: 0 },
  { q: "Which of the following is not a kind of product in the structure of intellect model?", o: ["symbolic", "classes", "systems", "implications"], a: 0 },

  /* Week 3 */
  { q: "The connections between nerves cells are called ___.", o: ["systems", "syntaxes", "neurons", "synapses"], a: 3 },
  { q: "In order to create a ___, information must be changed into a usable form, which occurs through a process known as encoding.", o: ["past memory", "new imagination", "new memory", "past imagination"], a: 2 },
  { q: "Calling back the stored information in response to some cue for use in a process or activity is called ___.", o: ["Retrieval", "Recall", "Recollection", "All of the given"], a: 3 },
  { q: "For many with ___ deficits, reading facial expressions and knowing how to respond are confusing daily challenges.", o: ["memory", "intelligence", "social cognition", "biological cognition"], a: 2 },
  { q: "The Information Processing View of Learning assumes that there are limits to how much information can be processed at each stage.", o: ["True", "False"], a: 0 },
  { q: "The Information Processing View of Learning assumes that information process is involved in ___", o: ["forgetting", "remembering", "perceiving", "All of the given"], a: 3 },
  { q: "The capacity of the sensory register is ___.", o: ["very small", "very large", "7+/-2 chunks", "unlimited"], a: 1 },
  { q: "Most children do not begin to engage in the process of rehearsal on their own until about age ___.", o: ["seven", "two", "thirteen", "one"], a: 0 },
  { q: "___ provides an interface between the sub-systems of working memory and the part of long term memory specialized for episodic memory.", o: ["Phonological loop", "Visuo-spatial sketchpad", "Retrieval buffer", "Episodic buffer"], a: 3 },
  { q: "Memories of specific episodes of one’s life refers to ___.", o: ["declarative memory", "experimental episodic memory", "autobiographical episodic memory", "procedural memory"], a: 2 },

  /* Week 4 */
  { q: "___ thinking is the ability to create mental representations of objects, places, events, or people in your mind.", o: ["General", "Creative", "Divergent", "Symbolic"], a: 3 },
  { q: "We compare new information to our ___ of the person, place, or thing, so we know how to categorize the new information mentally.", o: ["protofit", "protobite", "prototype", "none of the given"], a: 2 },
  { q: "Which of the following is not true?", o: ["Thinking is a higher mental process", "Thinking is a sub-vocal talking", "Thinking is fulfilling a need or problem solving", "Thinking is only done in verbal symbols"], a: 3 },
  { q: "Mental images are ___.", o: ["Auditory", "Visual", "Gustatory", "All of the given"], a: 3 },
  { q: "___ organize complex phenomena into simpler, easily understandable, and usable categories and help to solve our problems.", o: ["Concepts", "Propositions", "Constructs", "Components"], a: 0 },
  { q: "The lowermost level of Bloom’s taxonomy is ___.", o: ["remember", "apply", "understand", "analyze"], a: 0 },
  { q: "The psychomotor domain of the Bloom’s taxonomy is concerned with ___.", o: ["Biological makeup", "Thoughts and beliefs", "Feelings and emotions", "Skilled behavior"], a: 3 },
  { q: "Which of the following is an example of meta-cognition skills?", o: ["Ignoring your limits", "Self-monitoring", "Skimming all important information", "All of the given"], a: 1 },
  { q: "___ critical thinking skill helps you analyze and process information to come to an unbiased conclusion.", o: ["Open-mindedness", "Self-regulation", "Self-control", "Observation"], a: 0 },
  { q: "The inspiration phase of the creative thinking process refers to the ___ stage.", o: ["Incubation", "Insight", "Evaluation", "Preparation"], a: 3 },

  /* Week 5 */
  { q: "Which of the following is true about motivation?", o: ["It is a physical impulse", "It is an external process", "It has a willingness to activate but not channel the attitudes of learners", "None of the given"], a: 3 },
  { q: "The term “motivation” comes from a ___ word.", o: ["Greek", "Latin", "Hindi", "Bengali"], a: 1 },
  { q: "It is called extrinsic motivation if causal factor is ___.", o: ["curiosity", "social pressure", "self-satisfaction", "needs"], a: 1 },
  { q: "___ motivation is considered to be more crucial for students as it is associated with deep learning, better performance and self-efficacy.", o: ["Intrinsic", "Extrinsic", "Introjected regulation", "None of the given"], a: 0 },
  { q: "___ proposed that there are three primary drives that drive human behavior.", o: ["Hull", "Watson", "Piaget", "Gestalt"], a: 0 },
  { q: "Expectancy Theory of Motivation was developed by ___.", o: ["Vroom", "Hull", "Murray", "None of the given"], a: 0 },
  { q: "An example of ___ is thinking, “If I work hard I can achieve the targets my boss has set for me”.", o: ["purposeful", "valence", "instrumentality", "expectancy"], a: 3 },
  { q: "In SMART goals, T stands for ___.", o: ["Temporary", "Time-based", "Tough", "Testing"], a: 1 },
  { q: "Friendship is a ___ need in Maslow’s hierarchy.", o: ["Love and belonging", "Esteem", "Physiological", "Safety"], a: 0 },
  { q: "___ theory differentiates between autonomous motivation and controlled motivation.", o: ["Arousal", "Goal-setting", "Need hierarchy", "Self-determination"], a: 3 },

  /* Week 6 */
  { q: "According to Daniel Goleman, ___ component of emotional intelligence focuses on how we handle relationships with others.", o: ["self-awareness", "motivation", "empathy", "emotional regulation"], a: 2 },
  { q: "Emotional intelligence can be considered a type of ___ intelligence.", o: ["academic", "genetic", "social", "external"], a: 2 },
  { q: "Noticing a difficult emotion and slowing down or resisting any impulsive action that may follow highlights ___ component of emotional intelligence.", o: ["Self-regulation", "Motivation", "Emotional literacy", "Empathy"], a: 0 },
  { q: "The following are signs of emotional intelligence, except ___.", o: ["strong sense of curiosity", "holding onto mistakes", "ability to manage emotions in difficult situations", "self-confidence"], a: 1 },
  { q: "Perceiving emotions means ___.", o: ["Ignoring signals", "Understanding only what somebody is saying to you", "Understanding only somebody’s facial expression", "Understanding both verbal and nonverbal signals"], a: 3 },
  { q: "___ suggests that 10 distinct components provide the scaffolding of emotionally and socially intelligent behaviors:", o: ["Bar-On", "Goleman", "Salovey", "Mayer"], a: 0 },
  { q: "Which of the following is a facilitator of EQ?", o: ["optimism", "happiness", "independence", "all of the given"], a: 3 },
  { q: "___ is a strategy for improving one’s self-awareness.", o: ["rejecting feedback", "using critical self-talk daily", "developing a fixed mindset", "pursuing one’s passion"], a: 3 },
  { q: "Having students create autobiographies is an example of creating opportunities for ___.", o: ["emotional labor", "emotional contagion", "metacognition", "none of the given"], a: 2 },
  { q: "Which of the following is not true about management of emotions?", o: ["It is essentially a private act", "It is directly regulated by others", "It is influenced by cultural norms", "It is influenced by what society defines as appropriate to feel and express"], a: 1 },

  /* Week 7 */
  { q: "Which of the following is false about learning according to Gagne’s definition?", o: ["It is a change in human disposition", "It persists over a period of time", "It is simply ascribable to processes of growth", "None of the above"], a: 2 },
  { q: "Manual or physical skills come under ___ component of Bloom’s taxonomy.", o: ["Cognitive", "Affective", "Psychomotor", "Physical"], a: 2 },
  { q: "Reflection, learning and education was explored by ___.", o: ["Carl Rogers", "John Watson", "Benjamin Bloom", "John Dewey"], a: 3 },
  { q: "The principles of ___ refer to how close in time two events must be for a bond to be formed.", o: ["behavior", "reinforcement", "repetition", "contiguity"], a: 3 },
  { q: "___ gives information to learners about their success or failure concerning the task at hand.", o: ["Cognitive feedback", "Emotional feedback", "Reinforcement", "Physical feedback"], a: 0 },
  { q: "The ___ orientation to learning has a quality of personal involvement—the whole person in both feeling and cognitive aspects being in the learning event.", o: ["behavioral", "cognitive", "humanistic", "social"], a: 2 },
  { q: "Learning through play is ___ learning.", o: ["primary", "secondary", "passive", "active"], a: 3 },
  { q: "People with ___ learning style are prone to sorting their ideas after speaking, rather than thinking ideas through before.", o: ["logical", "solitary", "visual", "auditory"], a: 3 },
  { q: "Which of the following statements is false?", o: ["Effective instruction is static", "Effective instruction is eclectic", "Effective instruction is generative", "Effective instruction is interactive"], a: 0 },
  { q: "In ADDIE model, I stand for ___.", o: ["instruction", "implementation", "integration", "induction"], a: 1 },

  /* Week 8 */
  { q: "The word ‘pedagogy’ has been derived from the ___ word “pedagogue”.", o: ["Latin", "Sanskrit", "Greek", "English"], a: 2 },
  { q: "Which of the following statements is not true about pedagogy?", o: ["It is a method or way of teaching", "It is derived from the Greek word “pedagogue”", "It helps a teacher understand how learning should be facilitated.", "It harms the quality of teaching and learning."], a: 3 },
  { q: "Pedagogy can enhance the student-teacher relationship.", o: ["True", "False"], a: 0 },
  { q: "___ learning is based on the model that knowledge can be created within a population where members actively interact by sharing experiences and take on asymmetry roles.", o: ["integrative", "inquiry-based", "collaborative", "constructivist"], a: 2 },
  { q: "The Pedagogical Model provides an overview of the learning cycle and breaks it down into ___ domains or phases of instruction.", o: ["five", "three", "two", "seven"], a: 0 },
  { q: "Which of the following is not a type of inquiry-based approach?", o: ["confrontation", "structure", "guided", "open"], a: 0 },
  { q: "In experiential learning, students are engaged ___.", o: ["intellectually", "soulfully", "socially", "all of the given"], a: 3 },
  { q: "___ stage of experiential theory by Kolb focuses on planning.", o: ["concrete experience", "abstract conceptualization", "reflective observation", "active experimentation"], a: 3 },

  { q: "To develop learner readiness for online learning, training sessions on ___ are helpful.", o: ["netiquettes", "time management", "developing study skills", "all of the given"], a: 3 },
  { q: "The typical picture of a teacher being a dispenser of knowledge to the students has been replaced by that of a ___.", o: ["obstructor", "parent", "friend", "facilitator"], a: 3 },
  { q: "In 2018, Global Education and Skills Forum noted that the ‘future’ teacher would need the 5 skills to thrive in the 21st century. Which of the following is not one of them?", o: ["Strong social skills", "Data analysis", "External focus", "Strictness"], a: 3 },

  { q: "The central tenet of Bandura’s social-cognitive theory is that people seek to develop a sense of ___ over the important events in their lives.", o: ["agency", "dependency", "attachment", "emotion"], a: 0 },

  { q: "The term \"sustainable development\" was first mentioned in a book related to the 1972 UN Stockholm conference on ___.", o: ["water", "poverty", "economic crisis", "human environment"], a: 3 },
  { q: "Environmental sustainability focuses on impacts of processes, products and services on ___.", o: ["water", "biodiversity", "human health", "all of the given"], a: 3 },

  { q: "SDG ___ focuses on clean water and sanitation.", o: ["1", "17", "6", "3"], a: 2 },
  { q: "SDG 16 focuses on ___.", o: ["No poverty", "No hunger", "Good health", "Peace and justice"], a: 3 },
  { q: "On 20 October 2020, the Higher Education Sustainability Initiative (HESI) raised the flag of higher education as a driver for sustainable development and inclusive societies on the first day of the ___ 2020.", o: ["National Sustainability Meeting", "National Teachers Meeting", "Global Childrens’ Meeting", "Global Education Meeting"], a: 3 },

  { q: "Successful implementation of ESD requires a shift in focus from ___.", o: ["teaching to learning", "learning to teaching", "reading to speaking", "knowing to ignoring"], a: 0 },

/* ============================================================ */

const FULL_EXAM_MINUTES = 180;
const FULL_EXAM_QUESTIONS = 120;

const $ = id => document.getElementById(id);
let mode = 'test';
let paper = [];      // [{q, opts:[{text, correct}], chosen:null|number}]
let cur = 0;
let endAt = 0;
let startedAt = 0;
let tick = null;

function shuffle(arr){
  const a = arr.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function shuffleOpts(opts){
  // "All of the given" / "None of the given" style options stay last so they still make sense
  const isPinned = o => /^(all|none) of the (given|above)/i.test(o.text.trim());
  return shuffle(opts.filter(o => !isPinned(o))).concat(opts.filter(isPinned));
}
function defaultMinutes(n){
  return Math.max(1, Math.round(n * FULL_EXAM_MINUTES / FULL_EXAM_QUESTIONS));
}
function show(id){
  ["home","setup","practice","exam","result"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0, 0);
}
function pad(n){ return String(n).padStart(2, "0"); }
function fmt(sec){
  sec = Math.max(0, sec);
  return pad(Math.floor(sec/3600)) + ":" + pad(Math.floor(sec%3600/60)) + ":" + pad(sec%60);
}

/* ---------- setup ---------- */
function initSetup(){
  const total = QUESTIONS.length;
  $("numQ").max = total;
  $("numQ").value = total;
  $("mins").value = defaultMinutes(total);
  $("numHint").textContent = "Available: " + total + " questions.";
}
$("numQ").addEventListener("input", () => {
  const n = parseInt($("numQ").value, 10);
  if(n > 0) $("mins").value = defaultMinutes(Math.min(n, QUESTIONS.length));
});

$("startBtn").onclick = () => {
  let n = parseInt($("numQ").value, 10);
  let m = parseInt($("mins").value, 10);
  if(!(n > 0)) n = QUESTIONS.length;
  n = Math.min(n, QUESTIONS.length);
  if(!(m > 0)) m = defaultMinutes(n);

  paper = shuffle(QUESTIONS).slice(0, n).map(item => ({
    q: item.q,
    opts: shuffleOpts(item.o.map((t, i) => ({ text: t, correct: i === item.a }))),
    chosen: null
  }));
  cur = 0;
  startedAt = Date.now();
  endAt = startedAt + m * 60000;
  clearInterval(tick);
  if(mode === 'practice'){
    pChecked = false; pRight = 0; pWrong = 0;
    show("practice");
    renderPractice();
    return;
  }
  show("exam");
  buildPalette();
  render();
  tick = setInterval(updateTimer, 500);
  updateTimer();
};

/* ---------- mode selection ---------- */
function openSetup(m){
  mode = m;
  initSetup();
  $("setupTitle").textContent = m === 'practice' ? "Practice" : "Test";
  $("setupSub").textContent = m === 'practice'
    ? "Answer one question at a time and see the result right away."
    : "Timed exam. Your score is shown after you submit.";
  $("timeWrap").classList.toggle("hidden", m === 'practice');
  $("startBtn").textContent = m === 'practice' ? "Start practice" : "Start test";
  show("setup");
}
$("modePractice").onclick = () => openSetup('practice');
$("modeTest").onclick = () => openSetup('test');
$("backBtn").onclick = () => show("home");

/* ---------- practice mode ---------- */
let pChecked = false, pRight = 0, pWrong = 0;

function renderPractice(){
  const item = paper[cur];
  $("pQ").textContent = (cur + 1) + ". " + item.q;
  const box = $("pOpts");
  box.innerHTML = "";
  item.opts.forEach((opt, i) => {
    const b = document.createElement("button");
    let cls = "opt";
    if(pChecked){
      if(opt.correct) cls += " right";
      else if(item.chosen === i) cls += " wrong";
    } else if(item.chosen === i){
      cls += " sel";
    }
    b.className = cls;
    b.disabled = pChecked;
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = String.fromCharCode(65 + i);
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = opt.text;
    b.append(k, t);
    b.onclick = () => { if(pChecked) return; item.chosen = i; renderPractice(); };
    box.appendChild(b);
  });

  const v = $("pVerdict");
  if(pChecked){
    const ok = item.opts[item.chosen].correct;
    v.className = "verdict " + (ok ? "good" : "bad");
    v.textContent = ok ? "Correct" : "Wrong";
    if(!ok){
      const right = item.opts.find(o => o.correct);
      const small = document.createElement("small");
      small.textContent = "Correct answer: " + right.text;
      v.appendChild(small);
    }
  } else {
    v.className = "verdict hidden";
    v.textContent = "";
  }

  const last = cur === paper.length - 1;
  const act = $("pAction");
  if(!pChecked){
    act.textContent = "Submit answer";
    act.disabled = item.chosen === null;
  } else {
    act.textContent = last ? "Finish" : "Next question";
    act.disabled = false;
  }
  $("pCount").textContent = (cur + 1) + " / " + paper.length;
  $("pC").textContent = pRight;
  $("pW").textContent = pWrong;
  $("pProg").style.width = ((cur + (pChecked ? 1 : 0)) / paper.length * 100) + "%";
}

$("pAction").onclick = () => {
  const item = paper[cur];
  if(!pChecked){
    if(item.chosen === null) return;
    pChecked = true;
    if(item.opts[item.chosen].correct) pRight++; else pWrong++;
    renderPractice();
    return;
  }
  if(cur === paper.length - 1){ finish(); return; }
  cur++;
  pChecked = false;
  renderPractice();
  window.scrollTo(0, 0);
};

$("pEnd").onclick = () => {
  if(!pChecked) paper[cur].chosen = null;   // an unsubmitted pick does not count
  finish();
};

/* ---------- exam ---------- */
function render(){
  const item = paper[cur];
  $("qtext").textContent = (cur + 1) + ". " + item.q;
  const box = $("opts");
  box.innerHTML = "";
  item.opts.forEach((opt, i) => {
    const b = document.createElement("button");
    b.className = "opt" + (item.chosen === i ? " sel" : "");
    const k = document.createElement("span");
    k.className = "k";
    k.textContent = String.fromCharCode(65 + i);
    const t = document.createElement("span");
    t.className = "t";
    t.textContent = opt.text;
    b.append(k, t);
    b.onclick = () => { item.chosen = i; render(); updatePalette(); };
    box.appendChild(b);
  });
  $("prevBtn").disabled = cur === 0;
  $("nextBtn").disabled = cur === paper.length - 1;
  const done = paper.filter(p => p.chosen !== null).length;
  $("count").textContent = (cur + 1) + " / " + paper.length + " · " + done + " answered";
  $("prog").style.width = (done / paper.length * 100) + "%";
  updatePalette();
}
$("prevBtn").onclick = () => { if(cur > 0){ cur--; render(); window.scrollTo(0,0); } };
$("nextBtn").onclick = () => { if(cur < paper.length - 1){ cur++; render(); window.scrollTo(0,0); } };
$("clearBtn").onclick = () => { paper[cur].chosen = null; render(); };

function updateTimer(){
  const left = Math.round((endAt - Date.now()) / 1000);
  $("timer").textContent = fmt(left);
  $("timer").classList.toggle("low", left <= 300);
  if(left <= 0) finish();
}

/* ---------- palette ---------- */
function buildPalette(){
  const p = $("palette");
  p.innerHTML = "";
  paper.forEach((_, i) => {
    const b = document.createElement("button");
    b.className = "pal";
    b.textContent = i + 1;
    b.onclick = () => { cur = i; $("palModal").classList.add("hidden"); render(); window.scrollTo(0,0); };
    p.appendChild(b);
  });
}
function updatePalette(){
  [...$("palette").children].forEach((b, i) => {
    b.classList.toggle("done", paper[i].chosen !== null);
    b.classList.toggle("cur", i === cur);
  });
}
$("palBtn").onclick = () => $("palModal").classList.remove("hidden");
$("palClose").onclick = () => $("palModal").classList.add("hidden");

/* ---------- submit ---------- */
$("submitBtn").onclick = () => {
  const left = paper.filter(p => p.chosen === null).length;
  $("confirmMsg").textContent = left
    ? left + " question" + (left > 1 ? "s are" : " is") + " not answered. Submit anyway?"
    : "All questions answered. Submit now?";
  $("confirmModal").classList.remove("hidden");
};
$("confirmNo").onclick = () => $("confirmModal").classList.add("hidden");
$("confirmYes").onclick = () => { $("confirmModal").classList.add("hidden"); finish(); };

function finish(){
  clearInterval(tick);
  $("palModal").classList.add("hidden");
  $("confirmModal").classList.add("hidden");
  let c = 0, w = 0, s = 0;
  paper.forEach(p => {
    if(p.chosen === null) s++;
    else if(p.opts[p.chosen].correct) c++;
    else w++;
  });
  $("rCorrect").textContent = c;
  $("rWrong").textContent = w;
  $("rSkip").textContent = s;
  $("scoreBig").textContent = c + " / " + paper.length;
  const used = Math.min(Math.round((Date.now() - startedAt) / 1000), Math.round((endAt - startedAt) / 1000));
  $("timeUsed").textContent = mode === 'practice' ? "Practice mode" : "Time taken: " + fmt(used);
  show("result");
}
$("againBtn").onclick = () => { show("home"); };

window.addEventListener("beforeunload", e => {
  if(!$("exam").classList.contains("hidden") || !$("practice").classList.contains("hidden")){ e.preventDefault(); e.returnValue = ""; }
});

initSetup();
</script>
